<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Location Multi-Select</title>
    <style>
        body { font-family: 'Arial', sans-serif; direction: rtl; padding: 20px; }
        
        /* Location Multi-Select Styles */
        .location-multiselect {
            position: relative;
            width: 100%;
            max-width: 300px;
        }
        
        .location-select-header {
            padding: 8px 12px;
            border: 2px solid #ced4da;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            transition: all 0.2s ease;
            min-height: 38px;
        }
        
        .location-select-header:hover {
            border-color: #007bff;
        }
        
        .location-select-header.active {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }
        
        .location-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #ced4da;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .location-option {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .location-option:hover {
            background-color: rgba(0, 123, 255, 0.05);
        }
        
        .location-option:first-child {
            border-bottom: 1px solid #dee2e6;
            font-weight: 600;
        }
        
        .location-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #007bff;
        }
        
        .location-option label {
            cursor: pointer;
            font-size: 14px;
            margin: 0;
            flex: 1;
        }
        
        #location-dropdown-icon {
            transition: transform 0.2s ease;
            font-size: 12px;
            color: #6c757d;
        }
        
        .location-select-header.active #location-dropdown-icon {
            transform: rotate(180deg);
        }
        
        .test-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <h1>تستکردنی فلتەری شوێنی چەند هەڵبژاردن</h1>
    
    <div class="location-multiselect" id="location-multiselect">
        <div class="location-select-header" onclick="toggleLocationDropdown()">
            <span id="location-select-text">هەموو شوێنەکان</span>
            <span id="location-dropdown-icon">▼</span>
        </div>
        <div class="location-dropdown" id="location-dropdown" style="display: none;">
            <div class="location-option">
                <input type="checkbox" id="location-all" class="location-checkbox" checked>
                <label for="location-all">هەموو شوێنەکان</label>
            </div>
            <div id="location-options-container">
                <div class="location-option">
                    <input type="checkbox" id="location-sulaymaniyah" class="location-checkbox" value="سلێمانی">
                    <label for="location-sulaymaniyah">سلێمانی</label>
                </div>
                <div class="location-option">
                    <input type="checkbox" id="location-erbil" class="location-checkbox" value="هەولێر">
                    <label for="location-erbil">هەولێر</label>
                </div>
                <div class="location-option">
                    <input type="checkbox" id="location-kirkuk" class="location-checkbox" value="کەرکوک">
                    <label for="location-kirkuk">کەرکوک</label>
                </div>
                <div class="location-option">
                    <input type="checkbox" id="location-dohuk" class="location-checkbox" value="دهۆک">
                    <label for="location-dohuk">دهۆک</label>
                </div>
            </div>
        </div>
    </div>
    
    <div class="test-info">
        <h3>زانیارییەکانی تێست:</h3>
        <p><strong>شوێنە هەڵبژاردووەکان:</strong> <span id="selected-locations-display">هەموو شوێنەکان</span></p>
        <p><strong>بەها (بۆ API):</strong> <span id="selected-locations-value">all</span></p>
        <button onclick="testGetSelectedLocations()">تستکردنی getSelectedLocations()</button>
    </div>

    <script>
        // Location Multi-Select Functions
        function toggleLocationDropdown() {
            const dropdown = document.getElementById('location-dropdown');
            const header = document.querySelector('.location-select-header');
            const icon = document.getElementById('location-dropdown-icon');
            
            if (dropdown.style.display === 'none' || dropdown.style.display === '') {
                dropdown.style.display = 'block';
                header.classList.add('active');
                icon.style.transform = 'rotate(180deg)';
            } else {
                dropdown.style.display = 'none';
                header.classList.remove('active');
                icon.style.transform = 'rotate(0deg)';
            }
        }
        
        function updateLocationSelectText() {
            const allCheckbox = document.getElementById('location-all');
            const locationCheckboxes = document.querySelectorAll('.location-checkbox:not(#location-all)');
            const selectText = document.getElementById('location-select-text');
            const displaySpan = document.getElementById('selected-locations-display');
            const valueSpan = document.getElementById('selected-locations-value');
            
            if (allCheckbox && allCheckbox.checked) {
                selectText.textContent = 'هەموو شوێنەکان';
                displaySpan.textContent = 'هەموو شوێنەکان';
                valueSpan.textContent = 'all';
                return;
            }
            
            const selectedLocations = Array.from(locationCheckboxes)
                .filter(checkbox => checkbox.checked)
                .map(checkbox => checkbox.nextElementSibling.textContent);
            
            if (selectedLocations.length === 0) {
                selectText.textContent = 'هیچ شوێنێک هەڵنەبژارد';
                displaySpan.textContent = 'هیچ شوێنێک هەڵنەبژارد';
                valueSpan.textContent = 'none';
            } else if (selectedLocations.length === 1) {
                selectText.textContent = selectedLocations[0];
                displaySpan.textContent = selectedLocations[0];
                valueSpan.textContent = selectedLocations[0];
            } else if (selectedLocations.length <= 3) {
                selectText.textContent = selectedLocations.join(', ');
                displaySpan.textContent = selectedLocations.join(', ');
                valueSpan.textContent = selectedLocations.join(',');
            } else {
                selectText.textContent = `${selectedLocations.length} شوێن هەڵبژارد`;
                displaySpan.textContent = `${selectedLocations.length} شوێن هەڵبژارد`;
                valueSpan.textContent = selectedLocations.join(',');
            }
        }
        
        function getSelectedLocations() {
            const allCheckbox = document.getElementById('location-all');
            const locationCheckboxes = document.querySelectorAll('.location-checkbox:not(#location-all)');
            
            if (allCheckbox && allCheckbox.checked) {
                return 'all';
            }
            
            const selectedLocations = Array.from(locationCheckboxes)
                .filter(checkbox => checkbox.checked)
                .map(checkbox => checkbox.value);
            
            return selectedLocations.length > 0 ? selectedLocations.join(',') : 'none';
        }
        
        function handleLocationCheckboxChange() {
            const allCheckbox = document.getElementById('location-all');
            const locationCheckboxes = document.querySelectorAll('.location-checkbox:not(#location-all)');
            const checkedCount = Array.from(locationCheckboxes).filter(cb => cb.checked).length;
            
            // If any individual location is checked, uncheck "all"
            if (checkedCount > 0 && allCheckbox.checked) {
                allCheckbox.checked = false;
            }
            
            // If all individual locations are unchecked, check "all"
            if (checkedCount === 0 && !allCheckbox.checked) {
                allCheckbox.checked = true;
            }
            
            updateLocationSelectText();
        }
        
        function handleAllLocationCheckboxChange() {
            const allCheckbox = document.getElementById('location-all');
            const locationCheckboxes = document.querySelectorAll('.location-checkbox:not(#location-all)');
            
            if (allCheckbox.checked) {
                // Uncheck all individual locations
                locationCheckboxes.forEach(checkbox => {
                    checkbox.checked = false;
                });
            }
            
            updateLocationSelectText();
        }
        
        function testGetSelectedLocations() {
            const result = getSelectedLocations();
            alert(`نتیجەی getSelectedLocations(): ${result}`);
        }
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const multiselect = document.getElementById('location-multiselect');
            if (multiselect && !multiselect.contains(event.target)) {
                const dropdown = document.getElementById('location-dropdown');
                const header = document.querySelector('.location-select-header');
                const icon = document.getElementById('location-dropdown-icon');
                
                if (dropdown) dropdown.style.display = 'none';
                if (header) header.classList.remove('active');
                if (icon) icon.style.transform = 'rotate(0deg)';
            }
        });
        
        // Add event listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Add event listener for "all" checkbox
            const allCheckbox = document.getElementById('location-all');
            if (allCheckbox) {
                allCheckbox.addEventListener('change', handleAllLocationCheckboxChange);
            }
            
            // Add event listeners for individual location checkboxes
            const locationCheckboxes = document.querySelectorAll('.location-checkbox:not(#location-all)');
            locationCheckboxes.forEach(checkbox => {
                checkbox.addEventListener('change', handleLocationCheckboxChange);
            });
            
            // Initial update
            updateLocationSelectText();
        });
    </script>
</body>
</html>
